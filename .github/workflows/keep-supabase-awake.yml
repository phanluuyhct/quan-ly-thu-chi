# Giữ cho dự án Supabase "QL Thu Chi" không bị tạm dừng
# Đặt tại: .github/workflows/keep-supabase-awake.yml
#
# Supabase yêu cầu "a few user requests to the database each day" trong 7 ngày gần nhất.
# 1 lần/ngày là quá ít -> bản này chạy 4 lần/ngày, mỗi lần bắn 3 truy vấn thật vào bảng.
# => khoảng 12 truy vấn/ngày, rải đều, đủ ngưỡng "đủ hoạt động".

name: Keep Supabase Awake

on:
  schedule:
    # 4 lần/ngày, cách nhau 6 giờ: 01:13, 07:13, 13:13, 19:13 UTC
    # = 08:13, 14:13, 20:13, 02:13 giờ Việt Nam
    - cron: '13 1,7,13,19 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-supabase-awake
  cancel-in-progress: false

jobs:
  ping:
    name: Ping Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Goi REST API cua Supabase (3 truy van)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          PING_TABLE: ${{ vars.PING_TABLE }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::Thieu secret SUPABASE_URL hoac SUPABASE_ANON_KEY."
            exit 1
          fi

          BASE="${SUPABASE_URL%/}"
          TBL="${PING_TABLE:-}"
          if [ -z "$TBL" ]; then
            echo "::error::Chua dat variable PING_TABLE (vd: app_data). Can truy van vao bang that thi Supabase moi tinh la hoat dong."
            exit 1
          fi

          hit () {   # $1 = duong dan, $2 = header Prefer (co the rong), $3 = nhan
            local url="$BASE$1" code
            code=$(curl -sS -o /tmp/resp.txt -w '%{http_code}' \
                     --max-time 30 --retry 3 --retry-delay 8 --retry-all-errors \
                     -H "apikey: ${SUPABASE_ANON_KEY}" \
                     -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
                     ${2:+-H "Prefer: $2"} \
                     "$url")
            echo "  [$3] HTTP $code  <- $1"
            if [ "$code" -ge 400 ]; then
              echo "::error::Truy van '$3' that bai (HTTP $code)."
              head -c 600 /tmp/resp.txt || true
              return 1
            fi
            return 0
          }

          echo "Bang: $TBL"
          FAIL=0
          hit "/rest/v1/${TBL}?select=*&limit=1"        ""                 "doc-1-dong"  || FAIL=1
          sleep 20
          hit "/rest/v1/${TBL}?select=*&limit=0"        "count=exact"      "dem-so-dong" || FAIL=1
          sleep 20
          hit "/rest/v1/${TBL}?select=*&limit=1&offset=0" ""               "doc-lai"     || FAIL=1

          if [ "$FAIL" -ne 0 ]; then exit 1; fi
          echo "::notice::Supabase con thuc - da bay 3 truy van vao bang ${TBL}."
